<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f2">
    <meta name="description" content="2603 班的同学录。把一起走过的日常，留成以后。">
    <meta property="og:title" content="2603 同学录 · 把日常，留成以后">
    <meta property="og:description" content="关于我们，关于那些平凡又闪亮的日子。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/classroom.webp">
    <title>2603 同学录 · 把日常，留成以后</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="./assets/classroom.webp" as="image" fetchpriority="high">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./assets/app.js"></script>
  </head>
  <body>
    <main>
      <section class="cover" aria-labelledby="cover-title">
        <header class="masthead">
          <p class="brand"><strong>2603</strong><span class="brand-divider" aria-hidden="true"></span><span>同学录</span></p>
          <p class="masthead-note" lang="en">OUR CLASS. OUR STORY.</p>
        </header>

        <div class="cover-copy">
          <h1 id="cover-title"><span>把日常，</span><span>留成以后<span class="period">。</span></span></h1>
          <p>关于我们，<br class="mobile-break">关于那些平凡又闪亮的日子。</p>
        </div>

        <div class="memories" role="img" aria-label="校园氛围拼贴：阳光洒进教室，纸飞机飞过蓝天。图片为生成的意象素材。">
          <div class="memory memory-sky" data-photo="sky" aria-hidden="true">
            <div class="photo-paper"><img src="./assets/sky.webp" width="1536" height="1024" alt="" decoding="async"><span class="photo-note">把愿望，折进风里。</span></div>
          </div>
          <div class="notebook" data-photo="note" aria-hidden="true">
            <span class="notebook-small">属于我们的</span>
            <span class="notebook-title">未完<br>待续<span>＊</span></span>
            <span class="notebook-bottom" lang="en">TO BE CONTINUED</span>
          </div>
          <div class="memory memory-classroom" data-photo="classroom" aria-hidden="true">
            <div class="photo-paper"><img src="./assets/classroom.webp" width="1536" height="1024" alt="" fetchpriority="high"><span class="photo-note">总有一阵风，让你想起那间教室。</span></div>
          </div>
        </div>

        <div class="class-numeral" aria-hidden="true"><span>2</span><span>6</span><span>0</span><span>3</span></div>
        <p class="cover-footnote">有些日子，过着过着就成了想念。</p>
      </section>

      <section class="coming" aria-labelledby="coming-title">
        <div class="coming-rule" aria-hidden="true"></div>
        <div class="coming-content">
          <div class="keepsake" aria-hidden="true">
            <div class="keepsake-sheet keepsake-back"></div>
            <div class="keepsake-sheet keepsake-front"><span>2603</span><span>我们的故事</span><span class="keepsake-line"></span><span class="keepsake-line short"></span></div>
          </div>
          <p class="coming-intro">留一点空白，给正在发生的故事。</p>
          <h2 id="coming-title"><span>敬请</span><span>期待<span class="coming-asterisk" aria-hidden="true">＊</span></span></h2>
          <p class="coming-description">名字、照片，还有没说完的话。<br>都会慢慢住进这里。</p>
        </div>
        <footer class="colophon"><span>2603 班 · 我们的同学录</span><span lang="en">THE STORY IS STILL BEING WRITTEN.</span></footer>
      </section>
    </main>
  </body>
</html>
